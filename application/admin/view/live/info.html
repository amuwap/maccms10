{include file="public/head.html"}
<div class="layui-body">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <div class="layui-tab-content" style="padding: 20px 0;">
            <div class="layui-tab-item layui-show">
                <form class="layui-form" action="" method="post">
                    <input type="hidden" name="live_id" value="{$info.live_id|default=''}">
                    <div class="layui-form-item">
                        <label class="layui-form-label">直播名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_name" value="{$info.live_name|default=''}" lay-verify="required" placeholder="请输入直播名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">主播名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_anchor" value="{$info.live_anchor|default=''}" placeholder="请输入主播名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">直播分类</label>
                        <div class="layui-input-block">
                            <select name="live_category" lay-verify="required">
                                {foreach name="categories" item="category" key="key"}
                                <option value="{$key}" {if condition="isset($info.live_category) and $info.live_category eq $key"}selected{/if}>{$category}</option>
                                {/foreach}
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">直播封面</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_cover" value="{$info.live_cover|default=''}" placeholder="请输入直播封面地址" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频地址</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_video_url" value="{$info.live_video_url|default=''}" lay-verify="required" placeholder="请输入视频地址" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">直播状态</label>
                        <div class="layui-input-block">
                            <input type="radio" name="live_status" value="1" title="在线" {if condition="isset($info.live_status) and $info.live_status eq 1"}checked{/if}>
                            <input type="radio" name="live_status" value="0" title="离线" {if condition="isset($info.live_status) and $info.live_status eq 0"}checked{/if}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">自动开播</label>
                        <div class="layui-input-block">
                            <input type="radio" name="live_is_auto" value="1" title="是" {if condition="isset($info.live_is_auto) and $info.live_is_auto eq 1"}checked{/if}>
                            <input type="radio" name="live_is_auto" value="0" title="否" {if condition="isset($info.live_is_auto) and $info.live_is_auto eq 0"}checked{/if}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">开始时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_start_time" value="{$info.live_start_time|default=''}" placeholder="请输入开始时间戳" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">结束时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_end_time" value="{$info.live_end_time|default=''}" placeholder="请输入结束时间戳" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">直播价格</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_price" value="{$info.live_price|default='0'}" placeholder="请输入直播价格" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">免费观看秒数</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_free_seconds" value="{$info.live_free_seconds|default='0'}" placeholder="请输入免费观看秒数" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_sort" value="{$info.live_sort|default='0'}" placeholder="请输入排序" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-block">
                            <input type="text" name="live_remark" value="{$info.live_remark|default=''}" placeholder="请输入备注" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{include file="public/foot.html"}
