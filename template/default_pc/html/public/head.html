<!-- 头部 -->
<header class="header">
    <div class="container">
        <a href="{$maccms.path}" class="logo">{$maccms.site_name}</a>
        
        <!-- 导航 -->
        <nav class="nav">
            <a href="{$maccms.path}" class="nav-link">首页</a>
            {maccms:type ids="1,2,3,4" order="asc" by="sort"}
            <a href="{:mac_url_type($vo)}" class="nav-link">{$vo.type_name}</a>
            {/maccms:type}
            <a href="{:mac_url('label/rank')}" class="nav-link">排行榜</a>
        </nav>
        
        <!-- 用户操作 -->
        <div class="nav">
            {if condition="$maccms['user']['user_id']"}
            <a href="{:mac_url('user/index')}" class="nav-link">{$maccms['user']['user_name']}</a>
            <a href="{:mac_url('user/logout')}" class="nav-link">退出</a>
            {else /}
            <a href="{:mac_url('user/login')}" class="nav-link">登录</a>
            <a href="{:mac_url('user/reg')}" class="nav-link">注册</a>
            {/if}
        </div>
    </div>
</header>
