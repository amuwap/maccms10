{include file="public/head.html"}
<script src="../../js/config.js"></script>
            <div class="live-play-hero">
                <div class="live-play-hero-content">
                    <h1 class="live-play-hero-title">{$live_info.live_name|default='直播标题'}</h1>
                    <p class="live-play-hero-subtitle">主播：{$live_info.live_anchor|default='未知主播'}</p>
                </div>
            </div>
            <div class="container">
                <!-- 直播播放页面 -->
                <div class="live-play-page">
                    <div class="glass-card live-player-container">
                        <div class="live-player-wrapper">
                            <video class="live-player" controls {$config.frontend.live.auto_play|default=false ? 'autoplay' : ''} {$config.frontend.live.auto_loop|default=true ? 'loop' : ''} playsinline>
                                <source src="{$live_info.live_mp4_url|default=''}" type="video/mp4">
                                您的浏览器不支持视频播放
                            </video>
                            <div class="danmaku-container"></div>
                            <div class="gift-animation"></div>
                            <div class="combo-effect"></div>
                            <div class="lottery-container"></div>
                            <div class="announcement-container"></div>
                        </div>
                    </div>
                    
                    <!-- 直播信息 -->
                    <div class="glass-card live-info-card">
                        <div class="live-info-header">
                            <h1 class="live-title">{$live_info.live_name|default='直播标题'}</h1>
                            <div class="live-info-actions">
                                <button class="btn btn-primary">关注</button>
                                <button class="btn btn-secondary">分享</button>
                            </div>
                        </div>
                        <p class="live-anchor">主播：{$live_info.live_anchor|default='未知主播'}</p>
                        <div class="live-stats">
                            <div class="stat-item">
                                <span class="stat-label">观看人数</span>
                                <span class="stat-value viewer-count">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">点赞</span>
                                <span class="stat-value like-count">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">评论</span>
                                <span class="stat-value comment-count">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">礼物</span>
                                <span class="stat-value gift-count">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 互动区域 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <!-- 评论区 -->
                        <div class="glass-card comment-section">
                            <div class="section-header">
                                <h3 class="section-title">评论区</h3>
                            </div>
                            <div class="comment-list"></div>
                            <form class="comment-form">
                                <input type="text" placeholder="发表评论..." class="comment-input">
                                <button type="submit" class="comment-submit btn">发送</button>
                            </form>
                        </div>
                        
                        <!-- 礼物区 -->
                        <div class="glass-card gift-section">
                            <div class="section-header">
                                <h3 class="section-title">礼物</h3>
                            </div>
                            <div class="gift-panel"></div>
                            <div class="gift-ranking">
                                <h4 class="section-title">礼物排行</h4>
                            </div>
                        </div>
                        
                        <!-- 弹幕区 -->
                        <div class="glass-card danmaku-section">
                            <div class="section-header">
                                <h3 class="section-title">弹幕</h3>
                            </div>
                            <form class="danmaku-form">
                                <input type="text" placeholder="发送弹幕..." class="danmaku-input">
                                <button type="submit" class="danmaku-submit btn">发送</button>
                            </form>
                            <div class="viewer-diversity">
                                <h4 class="section-title">观众分布</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script>
                // 初始化直播播放器
                document.addEventListener('DOMContentLoaded', function() {
                    const liveId = '{$live_info.live_id|default=1}';
                    if (liveId) {
                        initFakeLive(liveId, '.live-play-page');
                    }
                });
                
                // 自动发送弹幕
                function initAutoDanmaku() {
                    if (TemplateConfig.live.danmaku.enabled) {
                        const danmakuContent = TemplateConfig.live.danmaku.content;
                        const interval = TemplateConfig.live.danmaku.interval * 1000;
                        
                        if (danmakuContent && danmakuContent.length > 0) {
                            setInterval(function() {
                                const randomIndex = Math.floor(Math.random() * danmakuContent.length);
                                const randomContent = danmakuContent[randomIndex];
                                
                                // 模拟发送弹幕
                                sendDanmaku(randomContent);
                            }, interval);
                        }
                    }
                }
                
                // 发送弹幕
                function sendDanmaku(content) {
                    if (!content) return;
                    
                    const danmakuContainer = document.querySelector('.danmaku-container');
                    if (!danmakuContainer) return;
                    
                    // 创建弹幕元素
                    const danmaku = document.createElement('div');
                    danmaku.className = 'danmaku-item';
                    danmaku.textContent = content;
                    
                    // 随机位置和颜色
                    danmaku.style.top = Math.random() * 80 + '%';
                    danmaku.style.color = getRandomColor();
                    
                    // 添加到容器
                    danmakuContainer.appendChild(danmaku);
                    
                    // 动画结束后移除
                    setTimeout(function() {
                        danmaku.remove();
                    }, 8000);
                }
                
                // 获取随机颜色
                function getRandomColor() {
                    const colors = ['#ffffff', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9', '#e17055', '#00b894', '#6c5ce7'];
                    return colors[Math.floor(Math.random() * colors.length)];
                }
                
                // 页面加载完成后初始化自动弹幕
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initAutoDanmaku);
                } else {
                    initAutoDanmaku();
                }
            </script>
