{include file="user/head.html"}
                    <div class="glass-card user-content">
                        <div class="content-header">
                            <h2>个人资料</h2>
                        </div>
                        <div class="profile-tabs">
                            <div class="tab-header">
                                <button class="tab-btn active" data-tab="basic">基本资料</button>
                                <button class="tab-btn" data-tab="edit">修改信息</button>
                            </div>
                            <div class="tab-content">
                                <div class="tab-panel active" id="basic">
                                    <div class="profile-info-list">
                                        <div class="info-item">
                                            <span class="info-label">用户名：</span>
                                            <span class="info-value">{$obj.user_name}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">所属会员组：</span>
                                            <span class="info-value">{$obj.group.group_name}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">会员期限：</span>
                                            <span class="info-value">{$obj.user_end_time|mac_day}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">QQ号码：</span>
                                            <span class="info-value">{$obj.user_qq}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Email地址：</span>
                                            <span class="info-value">{$obj.user_email}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">注册时间：</span>
                                            <span class="info-value">{$obj.user_reg_time|mac_day}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">账户积分：</span>
                                            <span class="info-value">{$obj.user_points}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="tab-panel" id="edit">
                                    <form class="profile-form" action="{:mac_url('user/save')}" method="post">
                                        <div class="form-group">
                                            <label>新密码：</label>
                                            <input type="password" name="user_pwd" class="form-input" placeholder="不修改请留空" />
                                        </div>
                                        <div class="form-group">
                                            <label>确认密码：</label>
                                            <input type="password" name="user_pwd2" class="form-input" placeholder="再次输入新密码" />
                                        </div>
                                        <div class="form-group">
                                            <label>QQ号码：</label>
                                            <input type="text" name="user_qq" class="form-input" value="{$obj.user_qq}" />
                                        </div>
                                        <div class="form-group">
                                            <label>Email地址：</label>
                                            <input type="email" name="user_email" class="form-input" value="{$obj.user_email}" />
                                        </div>
                                        <div class="form-group">
                                            <button type="submit" class="btn btn-primary">保存修改</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    <script>
                        $('.tab-btn').on('click', function() {
                            const tab = $(this).data('tab');
                            $('.tab-btn').removeClass('active');
                            $(this).addClass('active');
                            $('.tab-panel').removeClass('active');
                            $('#' + tab).addClass('active');
                        });
                    </script>
{include file="user/foot.html"}
